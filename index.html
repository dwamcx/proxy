<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Web Proxy Viewer</title>
  <style>
    :root { color-scheme: dark; --bg:#0b0e14; --panel:#111620; --panel2:#171e2a; --line:#283244; --ink:#e8edf5; --muted:#8e9bad; --accent:#7c9cff; --accent2:#a6baff; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
    .browser { min-height:100vh; display:flex; flex-direction:column; }
    .topbar { display:flex; align-items:center; gap:12px; padding:14px clamp(14px,3vw,30px); background:#0f131c; border-bottom:1px solid var(--line); }
    .logo { width:34px; height:34px; flex:0 0 34px; display:grid; place-items:center; border:1px solid #35435c; border-radius:11px; background:linear-gradient(145deg,#202b40,#141a26); color:var(--accent2); font-size:18px; font-weight:800; }
    .brand { font-size:16px; font-weight:750; letter-spacing:-.025em; }
    .subtitle { color:var(--muted); font-size:12px; margin-top:3px; }
    .traffic { margin-left:auto; display:flex; gap:6px; }
    .traffic i { display:block; width:8px; height:8px; border-radius:50%; background:#3a4557; }
    .nav { display:flex; align-items:center; gap:8px; padding:12px clamp(12px,3vw,30px); background:var(--panel); border-bottom:1px solid var(--line); }
    .nav-icon { width:34px; height:38px; display:grid; place-items:center; color:#8390a3; border:1px solid transparent; border-radius:10px; font-size:17px; }
    .nav-icon:hover { background:var(--panel2); color:var(--ink); }
    form { display:flex; align-items:center; gap:9px; flex:1; min-width:0; }
    .address-wrap { display:flex; align-items:center; gap:10px; min-width:0; flex:1; padding:0 13px; background:#090c12; border:1px solid #303b4e; border-radius:12px; transition:border-color .15s,box-shadow .15s; }
    .address-wrap:focus-within { border-color:var(--accent); box-shadow:0 0 0 3px #7c9cff20; }
    .lock { color:#83c9a5; font-size:14px; }
    input { min-width:0; width:100%; height:42px; border:0; outline:0; background:transparent; color:var(--ink); font:inherit; font-size:14px; }
    input::placeholder { color:#69768a; }
    button { min-height:42px; padding:0 18px; border:1px solid #8ba5ff; border-radius:11px; background:var(--accent); color:#101727; font:inherit; font-size:13px; font-weight:750; cursor:pointer; transition:filter .15s,transform .15s; white-space:nowrap; }
    button:hover { filter:brightness(1.08); }
    button:active { transform:translateY(1px); }
    button:disabled { opacity:.55; cursor:wait; }
    main { width:100%; max-width:1600px; margin:0 auto; padding:16px clamp(12px,2vw,26px) 24px; flex:1; display:flex; flex-direction:column; }
    .toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:38px; color:var(--muted); font-size:12px; padding:0 4px 12px; }
    #status { overflow-wrap:anywhere; }
    #openOriginal { color:var(--accent2); text-decoration:none; white-space:nowrap; }
    #openOriginal:hover { text-decoration:underline; }
    .frame-wrap { position:relative; flex:1; background:#0e131c; border:1px solid var(--line); border-radius:15px; overflow:hidden; min-height:60vh; box-shadow:0 18px 55px #00000024; }
    iframe { display:block; width:100%; height:calc(100vh - 245px); min-height:470px; border:0; background:white; }
    .welcome { min-height:60vh; padding:70px 22px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; color:var(--muted); }
    .welcome-icon { display:grid; place-items:center; width:64px; height:64px; margin-bottom:22px; border:1px solid #34425a; border-radius:20px; background:linear-gradient(145deg,#1e293b,#121925); color:var(--accent2); font-size:27px; box-shadow:0 10px 35px #0003; }
    .welcome strong { display:block; color:var(--ink); font-size:20px; font-weight:700; letter-spacing:-.025em; margin-bottom:9px; }
    .welcome p { margin:0; font-size:13px; line-height:1.7; }
    .notice { max-width:1000px; margin:13px 2px 0; font-size:11px; line-height:1.7; color:#748196; }
    @media(max-width:600px) { .topbar { padding:12px 14px; } .subtitle { display:none; } .nav { padding:10px 10px; gap:5px; } .nav-icon { width:28px; } form { gap:7px; } .address-wrap { padding:0 9px; gap:7px; } input { font-size:13px; } button { padding:0 12px; font-size:12px; } main { padding:12px 9px 18px; } .toolbar { align-items:flex-start; } iframe { height:70vh; min-height:420px; } .welcome { padding:48px 18px; } }
  </style>
</head>
<body>
  <div class="browser">
    <header class="topbar">
      <div class="logo">N</div>
      <div><div class="brand">NightBrowse</div><div class="subtitle">シンプルなWebページビューア</div></div>
      <div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div>
    </header>
    <div class="nav">
      <span class="nav-icon" aria-hidden="true">‹</span><span class="nav-icon" aria-hidden="true">›</span><span class="nav-icon" aria-hidden="true">↻</span>
      <form id="form">
        <div class="address-wrap"><span class="lock" aria-hidden="true">⌑</span><input id="url" type="url" inputmode="url" placeholder="https://example.com/" autocomplete="url" required aria-label="アクセスするURL"></div>
        <button id="go" type="submit">開く ↗</button>
      </form>
    </div>
    <main>
      <div class="toolbar">
        <span id="status" role="status">アクセスしたいHTTPSサイトのURLを入力してください。</span>
        <a id="openOriginal" href="#" target="_blank" rel="noopener noreferrer" hidden>元ページを開く ↗</a>
      </div>
      <section class="frame-wrap">
        <div class="welcome" id="welcome"><div class="welcome-icon" aria-hidden="true">⌕</div><strong>Webを開く</strong><p>アドレスバーにURLを入力して、ページを表示します。<br>HTTPSのURLに対応しています。</p></div>
        <iframe id="page" title="取得したページ" sandbox="" referrerpolicy="no-referrer" hidden></iframe>
      </section>
      <p class="notice">このビューアは取得したページのスクリプトを無効にして表示します。そのため、ログイン、動画プレイヤー、ボタンなどが動かないサイトがあります。ページのCSSや画像は元サイトから直接読み込まれる場合があります。信頼できないページを操作したり、個人情報を入力したりしないでください。</p>
    </main>
  </div>
  <script>
    // IMPORTANT: Replace this with your own deployed Cloudflare Worker URL.
    const WORKER_URL = "https://fake-proxy.dwamcx.workers.dev";

    const form = document.getElementById("form");
    const input = document.getElementById("url");
    const button = document.getElementById("go");
    const status = document.getElementById("status");
    const frame = document.getElementById("page");
    const welcome = document.getElementById("welcome");
    const openOriginal = document.getElementById("openOriginal");

    function safeDocument(html, baseUrl) {
      const doc = new DOMParser().parseFromString(html, "text/html");

      // Remove active or embedding features before placing content in sandbox.
      doc.querySelectorAll("script, noscript, object, embed, iframe, frame, frameset, portal, base").forEach(el => el.remove());
      doc.querySelectorAll("meta[http-equiv]").forEach(el => {
        if (/refresh|content-security-policy/i.test(el.getAttribute("http-equiv") || "")) el.remove();
      });
      doc.querySelectorAll("form").forEach(el => {
        el.removeAttribute("action");
        el.addEventListener?.("submit", e => e.preventDefault());
      });
      doc.querySelectorAll("*").forEach(el => {
        for (const attr of [...el.attributes]) {
          if (/^on/i.test(attr.name)) el.removeAttribute(attr.name);
          if ((attr.name === "href" || attr.name === "src" || attr.name === "xlink:href") &&
              /^\s*javascript:/i.test(attr.value)) el.removeAttribute(attr.name);
        }
      });

      const base = doc.createElement("base");
      base.href = baseUrl;
      (doc.head || doc.documentElement).prepend(base);

      const policy = doc.createElement("meta");
      policy.httpEquiv = "Content-Security-Policy";
      policy.content = "default-src https: data: blob:; script-src 'none'; object-src 'none'; frame-src 'none'; form-action 'none'; base-uri https:;";
      (doc.head || doc.documentElement).prepend(policy);

      return "<!doctype html>\n" + doc.documentElement.outerHTML;
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      const value = input.value.trim();
      let parsed;
      try {
        parsed = new URL(value);
        if (parsed.protocol !== "https:") throw new Error("HTTPS only");
      } catch {
        status.textContent = "有効な HTTPS URL を入力してください。";
        return;
      }

      button.disabled = true;
      status.textContent = "ページを取得しています…";
      openOriginal.hidden = true;
      try {
        const endpoint = new URL("/fetch", WORKER_URL);
        endpoint.searchParams.set("url", parsed.href);
        const response = await fetch(endpoint.href);
        const result = await response.json();
        if (!response.ok || result.error) throw new Error(result.error || `HTTP ${response.status}`);

        const safeHtml = safeDocument(result.html, result.finalUrl);
        frame.srcdoc = safeHtml;
        frame.hidden = false;
        welcome.hidden = true;
        status.textContent = "取得成功: " + result.finalUrl;
        openOriginal.href = result.finalUrl;
        openOriginal.hidden = false;
      } catch (error) {
        frame.hidden = true;
        welcome.hidden = false;
        status.textContent = "取得できませんでした: " + (error.message || "通信エラー");
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
