<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Web Proxy Viewer</title>
  <style>
    :root { color-scheme: light; --ink:#172033; --muted:#687386; --line:#dce2eb; --accent:#315efb; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:#f3f5f9; color:var(--ink); }
    header { padding:20px clamp(14px,4vw,44px) 16px; background:#fff; border-bottom:1px solid var(--line); }
    .brand { font-size:20px; font-weight:750; letter-spacing:-.03em; }
    .sub { color:var(--muted); font-size:13px; margin-top:5px; }
    form { display:flex; gap:8px; margin-top:16px; max-width:1100px; }
    input { min-width:0; flex:1; border:1px solid #cbd3e0; border-radius:12px; padding:13px 14px; font:inherit; outline:none; background:white; }
    input:focus { border-color:var(--accent); box-shadow:0 0 0 3px #315efb1c; }
    button { border:0; border-radius:12px; padding:0 20px; background:var(--accent); color:white; font:inherit; font-weight:700; cursor:pointer; }
    button:disabled { opacity:.55; cursor:wait; }
    main { padding:16px clamp(10px,2vw,24px) 24px; }
    .toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; color:var(--muted); font-size:13px; padding:0 4px 12px; }
    #status { overflow-wrap:anywhere; }
    .frame-wrap { background:white; border:1px solid var(--line); border-radius:14px; overflow:hidden; min-height:65vh; box-shadow:0 6px 24px #15213b0a; }
    iframe { display:block; width:100%; height:72vh; min-height:500px; border:0; background:white; }
    .welcome { padding:44px 22px; text-align:center; color:var(--muted); }
    .welcome strong { display:block; color:var(--ink); font-size:18px; margin-bottom:8px; }
    .notice { max-width:850px; margin:14px auto 0; font-size:12px; line-height:1.65; color:var(--muted); }
    @media(max-width:600px) { form { flex-direction:column; } button { min-height:46px; } iframe { height:70vh; min-height:420px; } }
  </style>
</head>
<body>
  <header>
    <div class="brand">Web Proxy Viewer</div>
    <div class="sub">URLから公開Webページを取得して表示する試作版</div>
    <form id="form">
      <input id="url" type="url" inputmode="url" placeholder="https://example.com/" autocomplete="url" required>
      <button id="go" type="submit">ページを取得</button>
    </form>
  </header>
  <main>
    <div class="toolbar">
      <span id="status" role="status">Worker URLを設定してから利用してください。</span>
      <a id="openOriginal" href="#" target="_blank" rel="noopener noreferrer" hidden>元ページを開く</a>
    </div>
    <section class="frame-wrap">
      <div class="welcome" id="welcome"><strong>ページを取得して表示</strong>上の欄に HTTPS のURLを入力してください。</div>
      <iframe id="page" title="取得したページ" sandbox="" referrerpolicy="no-referrer" hidden></iframe>
    </section>
    <p class="notice">安全のため、取得したページはスクリプトを無効にした隔離フレーム内に表示します。そのため、ログイン、動画プレイヤー、ボタンなどが動かないサイトがあります。ページのCSSや画像は元サイトから直接読み込まれる場合があります。信頼できないページを操作したり、個人情報を入力したりしないでください。</p>
  </main>
  <script>
    // IMPORTANT: Replace this with your own deployed Cloudflare Worker URL.
    const WORKER_URL = "https://fake-proxy.dwamcx.workers.dev";

    const form = document.getElementById("form");
    const input = document.getElementById("url");
    const button = document.getElementById("go");
    const status = document.getElementById("status");
    const frame = document.getElementById("page");
    const welcome = document.getElementById("welcome");
    const openOriginal = document.getElementById("openOriginal");

    function safeDocument(html, baseUrl) {
      const doc = new DOMParser().parseFromString(html, "text/html");

      // Remove active or embedding features before placing content in sandbox.
      doc.querySelectorAll("script, noscript, object, embed, iframe, frame, frameset, portal, base").forEach(el => el.remove());
      doc.querySelectorAll("meta[http-equiv]").forEach(el => {
        if (/refresh|content-security-policy/i.test(el.getAttribute("http-equiv") || "")) el.remove();
      });
      doc.querySelectorAll("form").forEach(el => {
        el.removeAttribute("action");
        el.addEventListener?.("submit", e => e.preventDefault());
      });
      doc.querySelectorAll("*").forEach(el => {
        for (const attr of [...el.attributes]) {
          if (/^on/i.test(attr.name)) el.removeAttribute(attr.name);
          if ((attr.name === "href" || attr.name === "src" || attr.name === "xlink:href") &&
              /^\s*javascript:/i.test(attr.value)) el.removeAttribute(attr.name);
        }
      });

      const base = doc.createElement("base");
      base.href = baseUrl;
      (doc.head || doc.documentElement).prepend(base);

      const policy = doc.createElement("meta");
      policy.httpEquiv = "Content-Security-Policy";
      policy.content = "default-src https: data: blob:; script-src 'none'; object-src 'none'; frame-src 'none'; form-action 'none'; base-uri https:;";
      (doc.head || doc.documentElement).prepend(policy);

      return "<!doctype html>\n" + doc.documentElement.outerHTML;
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      const value = input.value.trim();
      let parsed;
      try {
        parsed = new URL(value);
        if (parsed.protocol !== "https:") throw new Error("HTTPS only");
      } catch {
        status.textContent = "有効な HTTPS URL を入力してください。";
        return;
      }

      button.disabled = true;
      status.textContent = "ページを取得しています…";
      openOriginal.hidden = true;
      try {
        const endpoint = new URL("/fetch", WORKER_URL);
        endpoint.searchParams.set("url", parsed.href);
        const response = await fetch(endpoint.href);
        const result = await response.json();
        if (!response.ok || result.error) throw new Error(result.error || `HTTP ${response.status}`);

        const safeHtml = safeDocument(result.html, result.finalUrl);
        frame.srcdoc = safeHtml;
        frame.hidden = false;
        welcome.hidden = true;
        status.textContent = "取得成功: " + result.finalUrl;
        openOriginal.href = result.finalUrl;
        openOriginal.hidden = false;
      } catch (error) {
        frame.hidden = true;
        welcome.hidden = false;
        status.textContent = "取得できませんでした: " + (error.message || "通信エラー");
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
